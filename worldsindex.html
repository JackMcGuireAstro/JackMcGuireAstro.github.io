<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://jackmcguireastro.github.io/worldsindex/">
  <title>Opening WorldsIndex…</title>
  <script>
    const destination = new URL('worldsindex/', location.href);
    destination.search = location.search;
    destination.hash = location.hash;
    location.replace(destination);
  </script>
</head>
<body>
  <p><a id="destination" href="worldsindex/">Open WorldsIndex on jackmcguireastro.github.io</a></p>
  <script>document.getElementById('destination').href = destination;</script>
</body>
</html>
