   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>TRAPPIST-1 e · Published radius estimates</dc:title>
    <dc:description>TRAPPIST-1 e radius estimates from NASA Planetary Systems publication-specific rows retained by WorldsIndex: Gillon et al. 2017, 0.918 ± 0.039 Earth radii; Agol et al. 2021, 0.920 +0.013/−0.012 Earth radii. Horizontal bars retain the source rows’ reported uncertainties, including their asymmetry. No common confidence level is assigned; the rows are not averaged and their difference is not interpreted as physical growth.</dc:description>
    <dc:format>image/svg+xml</dc:format>
    <dc:creator>
     <cc:Agent>
      <dc:title>Matplotlib</dc:title>
     </cc:Agent>
    </dc:creator>
   </cc:Work>
  </rdf:RDF>
 </metadata>
